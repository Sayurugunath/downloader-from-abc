name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend

      - name: Check browser script syntax
        run: node --check frontend/app.js

      - name: Smoke-test the local API and frontend
        run: |
          uvicorn server:app --app-dir backend --host 127.0.0.1 --port 8000 &
          for attempt in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8000/api/downloads && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:8000/api/downloads > /dev/null
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
